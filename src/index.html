<!DOCTYPE html>
<html>
  <head>
    <title>gabagoo</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="../node_modules/ag-grid-community/styles/ag-grid.css" />
    <link rel="stylesheet" href="../node_modules/ag-grid-community/styles/ag-theme-balham.css" />
    <script src="app-bundled.js"></script>
  </head>
  <body>
    <div id="myGrid" class="tracklist ag-theme-balham"></div>

    <footer class="player-footer">
      <div class="player-controls">
        <span id="currentTrackTitle"></span>
        <span id="currentTrackArtist"></span>
      </div>

      <div class="player-info">
        <span id="progressText"></span>
        <progress
          id="progressBar"
          value="0"
          max="100"
          class="progress"
        ></progress>
        <button id="prevButton" class="control-button">
          <img src="assets/skip-back.svg" alt="Previous Track" />
        </button>
        <button id="pauseButton" class="control-button">
          <img id="playPauseIcon" src="assets/play.svg" alt="Play/Pause" />
        </button>
        <button id="nextButton" class="control-button">
          <img src="assets/skip-forward.svg" alt="Next Track" />
        </button>
      </div>

      <div class="player-right-controls">
        <input
          id="volumeSlider"
          class="right-button"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
        <button id="loadButton" class="right-button">
          Select Library Folder
        </button>
      </div>
    </footer>
  </body>
</html>
