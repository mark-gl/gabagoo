<!DOCTYPE html>
<html>

<head>
  <title>gabagoo</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="../node_modules/ag-grid-community/styles/ag-grid.css" />
  <link rel="stylesheet" href="../node_modules/ag-grid-community/styles/ag-theme-balham.css" />
  <script src="https://kit.fontawesome.com/b870209a70.js" crossorigin="anonymous"></script>
  <script src="app-bundled.js"></script>
</head>

<body>
  <div class="split">
    <div id="split-0"></div>
    <div id="split-1">
      <div id="myGrid" class="tracklist ag-theme-balham"></div>
    </div>
  </div>

  <footer class="player-footer">
    <div class="player-left-controls">
      <img class="track-art" id="currentTrackArt" src="assets/music.svg" style="background-color: lightgray"
        alt="Album Art" />
      <div class="track-details">
        <div class="track-details-text track-details-title" id="currentTrackTitle">
          Nothing Playing
        </div>
        <div className="track-details-text" id="currentTrackArtist">
          No Artist
        </div>
      </div>
    </div>

    <div class="player-middle-controls">
      <div class="player-middle-upper">
        <progress id="progressBar" value="0" max="100" class="progress"></progress>
      </div>
      <div class="player-middle-lower">
        <span id="elapsed">0:00</span>
        <div class="player-middle-lower-centre">
          <button id="prevButton" class="control-button">
            <img src="assets/skip-back.svg" alt="Previous Track" />
          </button>
          <button id="pauseButton" class="control-button">
            <img id="playPauseIcon" src="assets/play.svg" alt="Play/Pause" />
          </button>
          <button id="nextButton" class="control-button">
            <img src="assets/skip-forward.svg" alt="Next Track" />
          </button>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="player-right-controls">
      <span id="progressText"></span>
      <input id="volumeSlider" class="right-button" type="range" min="0" max="1" step="0.01" value="1" />
      <button id="loadButton" class="right-button">
        Select Library Folder
      </button>
    </div>
  </footer>
</body>

</html>
